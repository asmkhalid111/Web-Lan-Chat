<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-LAN-Chat | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#4f46e5',
                        dark: '#0f172a',
                        glass: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white h-screen flex font-sans antialiased overflow-hidden bg-gradient-to-br from-gray-900 via-indigo-950 to-gray-900">
    
    <!-- Sidebar -->
    <div class="w-64 bg-white/5 border-r border-white/10 backdrop-blur-xl flex flex-col">
        <div class="p-4 border-b border-white/10">
            <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">LAN-Chat</h2>
            <div class="mt-2 text-sm text-gray-400">Logged in as: <span id="user-name" class="text-white font-medium"></span></div>
            <button id="btn-logout" class="mt-2 text-xs text-red-400 hover:text-red-300">Log out</button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4">
            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Channels</h3>
            <ul class="space-y-1 mb-6">
                <li>
                    <button class="w-full text-left px-2 py-1.5 rounded bg-primary/20 text-primary font-medium"># global-chat</button>
                </li>
            </ul>

            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Online Users</h3>
            <ul id="online-users-list" class="space-y-1">
                <!-- Dynamically populated -->
            </ul>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col relative z-10">
        <!-- Chat Header -->
        <div class="h-14 border-b border-white/10 bg-white/5 backdrop-blur-xl flex items-center px-6 shadow-sm">
            <h2 class="text-lg font-semibold flex items-center">
                <span class="text-gray-400 mr-2">#</span> global-chat
            </h2>
        </div>

        <!-- Messages Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center text-sm text-gray-500 my-4">Welcome to the global chat!</div>
            <!-- Messages go here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white/5 backdrop-blur-xl border-t border-white/10">
            <form id="chat-form" class="flex items-center space-x-2">
                <input type="text" id="chat-input" class="flex-1 px-4 py-3 rounded-lg bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder-gray-500" placeholder="Message #global-chat..." autocomplete="off">
                <button type="submit" class="px-6 py-3 rounded-lg bg-primary hover:bg-secondary transition-colors font-medium text-white shadow-lg shadow-primary/30">Send</button>
            </form>
        </div>
    </div>

    <!-- Animated background elements -->
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-primary rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>

    <script src="/static/app.js"></script>
</body>
</html>
