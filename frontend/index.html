<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-LAN-Chat | Login</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#4f46e5',
                        dark: '#0f172a',
                        glass: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center font-sans antialiased bg-gradient-to-br from-gray-900 via-indigo-950 to-gray-900 relative overflow-x-hidden overflow-y-auto">
    
    <!-- Animated background elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary rounded-full mix-blend-multiply filter blur-[128px] opacity-50 animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-50 animate-blob animation-delay-2000"></div>

    <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl relative z-10 border border-white/10 backdrop-blur-xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 mb-2">Web-LAN-Chat</h1>
            <p class="text-gray-400">Connect securely within the lab</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-6">
            <div id="login-error" class="hidden bg-red-500/20 text-red-300 text-sm p-3 rounded-lg border border-red-500/50"></div>
            <div>
                <label for="student_id" class="block text-sm font-medium text-gray-300 mb-1">Student ID</label>
                <input type="text" id="student_id" name="student_id" required class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder-gray-500" placeholder="e.g. 024231 or @diu.edu.bd">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder-gray-500" placeholder="••••••••">
            </div>
            <button type="submit" id="btn-login" class="w-full py-3 rounded-lg bg-primary hover:bg-secondary transition-colors font-medium text-white shadow-lg shadow-primary/30 relative overflow-hidden group">
                <span class="relative z-10">Sign In</span>
                <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
            </button>
        </form>

        <!-- Registration Form (Hidden by default) -->
        <form id="register-form" class="space-y-6 hidden">
            <div id="register-error" class="hidden bg-red-500/20 text-red-300 text-sm p-3 rounded-lg border border-red-500/50"></div>
            <div id="register-success" class="hidden bg-green-500/20 text-green-300 text-sm p-3 rounded-lg border border-green-500/50"></div>
            
            <div>
                <label for="reg_student_id" class="block text-sm font-medium text-gray-300 mb-1">Student ID</label>
                <input type="text" id="reg_student_id" name="student_id" required class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder-gray-500">
            </div>
            <div>
                <label for="reg_name" class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                <input type="text" id="reg_name" name="name" required class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder-gray-500">
            </div>
            <div>
                <label for="reg_password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="reg_password" name="password" required class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder-gray-500">
            </div>
            <button type="submit" id="btn-register" class="w-full py-3 rounded-lg bg-cyan-600 hover:bg-cyan-700 transition-colors font-medium text-white shadow-lg shadow-cyan-600/30 relative overflow-hidden group">
                <span class="relative z-10">Create Account</span>
                <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
            </button>
        </form>

        <!-- Toggle Auth Mode -->
        <div class="mt-6 text-center">
            <button id="toggle-auth" class="text-sm text-gray-400 hover:text-white transition-colors">
                Need an account? Register here
            </button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
